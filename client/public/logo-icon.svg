<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- الخلفية -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#grad1)"/>
  
  <!-- القلم -->
  <g transform="translate(100, 100)">
    <!-- جسم القلم -->
    <path d="M -8,-55 L 8,-55 L 5,20 L -5,20 Z" fill="#FFFFFF"/>
    <!-- رأس القلم -->
    <path d="M -5,20 L 5,20 L 0,40 Z" fill="#FCD34D"/>
    <!-- خط الكتابة -->
    <circle cx="0" cy="42" r="2.5" fill="#1E293B"/>
    <!-- ظل جانبي -->
    <path d="M 8,-55 L 8,-55 L 5,20 L 5,20 Z" fill="#E0E7FF" opacity="0.5"/>
  </g>
  
  <!-- النقاط -->
  <circle cx="40" cy="160" r="4" fill="#FCD34D"/>
  <circle cx="50" cy="160" r="4" fill="#FCD34D" opacity="0.7"/>
  <circle cx="60" cy="160" r="4" fill="#FCD34D" opacity="0.4"/>
</svg>
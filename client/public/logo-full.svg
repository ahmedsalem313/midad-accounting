<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1" />
      <stop offset="100%" style="stop-color:#8B5CF6" />
    </linearGradient>
    <linearGradient id="grad3gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D" />
      <stop offset="100%" style="stop-color:#F59E0B" />
    </linearGradient>
  </defs>
  
  <!-- الأيقونة على اليمين (لأن العربية من اليمين) -->
  <g transform="translate(400, 100)">
    <rect x="-70" y="-70" width="140" height="140" rx="35" fill="url(#grad3)"/>
    
    <!-- قلم -->
    <path d="M -8,-50 L 8,-50 L 5,25 L -5,25 Z" fill="#FFFFFF"/>
    <path d="M -5,25 L 5,25 L 0,45 Z" fill="url(#grad3gold)"/>
    <circle cx="0" cy="47" r="2.5" fill="#1E293B"/>
    
    <!-- نقاط تحت -->
    <circle cx="-20" cy="55" r="3" fill="#FCD34D"/>
    <circle cx="-8" cy="55" r="3" fill="#FCD34D" opacity="0.7"/>
    <circle cx="4" cy="55" r="3" fill="#FCD34D" opacity="0.4"/>
  </g>
  
  <!-- النص -->
  <g transform="translate(50, 100)">
    <!-- مداد -->
    <text x="250" y="10" font-family="Cairo, sans-serif" font-size="72" font-weight="800" 
          fill="#4338CA" text-anchor="middle">مداد</text>
    
    <!-- السطر السفلي -->
    <text x="250" y="50" font-family="Cairo, sans-serif" font-size="18" font-weight="600" 
          fill="#8B5CF6" text-anchor="middle" letter-spacing="3">المحاسبي</text>
    
    <!-- خط فاصل -->
    <line x1="130" y1="30" x2="180" y2="30" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
    <line x1="320" y1="30" x2="370" y2="30" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>